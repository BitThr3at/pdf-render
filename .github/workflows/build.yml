name: Build

# Plain compile-and-package check so a broken build is caught before it reaches a tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build shaded JAR
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pdf-render-jar
          path: target/*.jar
          # target/original-*.jar is the pre-shade build and will not load in Burp.
          if-no-files-found: error
          retention-days: 14
